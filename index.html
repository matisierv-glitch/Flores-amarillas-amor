<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Flores Amarillas 🌻</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================================================
   PANTALLA INICIAL NEGRA
========================================================= */

#inicio {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000000;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    z-index: 1000;

    opacity: 1;

    transition: opacity 2.5s ease;

}


/* =========================================================
   GIRASOL INICIAL
========================================================= */

.sunflower {

    position: relative;

    width: 190px;
    height: 190px;

}


/* pétalos */

.sunflower .petal {

    position: absolute;

    width: 48px;
    height: 90px;

    left: 71px;
    top: 5px;

    background: #F5A900;

    border-radius: 50%;

    transform-origin: 24px 90px;

}


/* posiciones */

.sunflower .p1  { transform: rotate(0deg); }
.sunflower .p2  { transform: rotate(30deg); }
.sunflower .p3  { transform: rotate(60deg); }
.sunflower .p4  { transform: rotate(90deg); }
.sunflower .p5  { transform: rotate(120deg); }
.sunflower .p6  { transform: rotate(150deg); }
.sunflower .p7  { transform: rotate(180deg); }
.sunflower .p8  { transform: rotate(210deg); }
.sunflower .p9  { transform: rotate(240deg); }
.sunflower .p10 { transform: rotate(270deg); }
.sunflower .p11 { transform: rotate(300deg); }
.sunflower .p12 { transform: rotate(330deg); }


/* centro */

.sunflower .center {

    position: absolute;

    width: 78px;
    height: 78px;

    left: 56px;
    top: 56px;

    border-radius: 50%;

    background: #542D13;

    z-index: 10;

    box-shadow:
        inset 0 0 0 5px #3A1E0D;

}


/* semillas */

.sunflower .center::after {

    content: "";

    position: absolute;

    inset: 12px;

    border-radius: 50%;

    background-image:
        radial-gradient(
            circle,
            #1F1007 2px,
            transparent 2.5px
        );

    background-size: 11px 11px;

}


/* =========================================================
   BOTÓN APRETAR
========================================================= */

#apretar {

    margin-top: 15px;

    padding: 12px 30px;

    background: transparent;

    border: 1px solid #F5A900;

    border-radius: 30px;

    color: #F5A900;

    font-family: Georgia, serif;

    font-size: 20px;

    letter-spacing: 4px;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease;

}

#apretar:hover {

    transform: scale(1.08);

    background: rgba(245,169,0,.12);

}


/* =========================================================
   PÁGINA FINAL
========================================================= */

#final {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #ffffff;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 2.5s ease,
        visibility 0s linear 2.5s;

    overflow: hidden;

}


/*
   ESTA ERA LA PARTE QUE FALTABA
   EN EL CÓDIGO ANTERIOR.
*/

#final.activa {

    opacity: 1;

    visibility: visible;

    transition:
        opacity 2.5s ease;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenido {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 60px;

    padding: 30px;

}


/* =========================================================
   PLANTA
========================================================= */

.planta {

    position: relative;

    width: 520px;
    height: 650px;

    flex-shrink: 0;

    transform:
        translateY(180px)
        scale(.35);

    opacity: 0;

    transition:
        transform 3s cubic-bezier(.2,.8,.2,1),
        opacity 2s ease;

}


/* planta emergiendo */

#final.activa .planta {

    transform:
        translateY(0)
        scale(1);

    opacity: 1;

}


/* =========================================================
   TALLO
========================================================= */

.tallo {

    position: absolute;

    width: 24px;
    height: 520px;

    left: 248px;
    bottom: 0;

    background:
        linear-gradient(
            90deg,
            #276B20,
            #3C922E,
            #276B20
        );

    border-radius: 20px;

}


/* =========================================================
   RAMAS
========================================================= */

.branch {

    position: absolute;

    height: 13px;

    background: #33852A;

    border-radius: 20px;

    transform-origin: left center;

}


.branch.left1 {

    width: 190px;

    left: 250px;
    bottom: 245px;

    transform: rotate(205deg);

}


.branch.left2 {

    width: 150px;

    left: 250px;
    bottom: 370px;

    transform: rotate(205deg);

}


.branch.right1 {

    width: 190px;

    left: 270px;
    bottom: 170px;

    transform: rotate(-25deg);

}


.branch.right2 {

    width: 150px;

    left: 270px;
    bottom: 350px;

    transform: rotate(-25deg);

}


/* =========================================================
   HOJAS
========================================================= */

.leaf {

    position: absolute;

    width: 120px;
    height: 55px;

    background: #398F2D;

    border-radius: 100% 0 100% 0;

}


.leaf.l1 {

    left: 110px;
    bottom: 210px;

    transform: rotate(25deg);

}


.leaf.l2 {

    left: 135px;
    bottom: 330px;

    transform: rotate(205deg);

}


.leaf.l3 {

    left: 105px;
    bottom: 430px;

    transform: rotate(25deg);

}


.leaf.l4 {

    right: 95px;
    bottom: 165px;

    transform: rotate(160deg);

}


.leaf.l5 {

    right: 120px;
    bottom: 315px;

    transform: rotate(-20deg);

}


.leaf.l6 {

    right: 90px;
    bottom: 415px;

    transform: rotate(155deg);

}


/* =========================================================
   GIRASOLES DE LA PLANTA
========================================================= */

.flower {

    position: absolute;

    width: 150px;
    height: 150px;

    z-index: 20;

}


/* posiciones */

.flower.f1 {

    left: 185px;
    top: 0;

}


.flower.f2 {

    left: 15px;
    top: 145px;

    transform: scale(.78);

}


.flower.f3 {

    right: 10px;
    top: 160px;

    transform: scale(.78);

}


.flower.f4 {

    left: 90px;
    top: 275px;

    transform: scale(.65);

}


.flower.f5 {

    right: 85px;
    top: 285px;

    transform: scale(.67);

}


/* =========================================================
   PÉTALOS
========================================================= */

.flower .petal {

    position: absolute;

    width: 40px;
    height: 76px;

    left: 55px;
    top: 4px;

    background: #F5A900;

    border-radius: 50%;

    transform-origin: 20px 76px;

}


.flower .p1  { transform: rotate(0deg); }
.flower .p2  { transform: rotate(30deg); }
.flower .p3  { transform: rotate(60deg); }
.flower .p4  { transform: rotate(90deg); }
.flower .p5  { transform: rotate(120deg); }
.flower .p6  { transform: rotate(150deg); }
.flower .p7  { transform: rotate(180deg); }
.flower .p8  { transform: rotate(210deg); }
.flower .p9  { transform: rotate(240deg); }
.flower .p10 { transform: rotate(270deg); }
.flower .p11 { transform: rotate(300deg); }
.flower .p12 { transform: rotate(330deg); }


/* centros */

.flower .center {

    position: absolute;

    width: 65px;
    height: 65px;

    left: 43px;
    top: 43px;

    border-radius: 50%;

    background: #542D13;

    z-index: 30;

}


.flower .center::after {

    content: "";

    position: absolute;

    inset: 10px;

    border-radius: 50%;

    background-image:
        radial-gradient(
            circle,
            #1F1007 2px,
            transparent 2.5px
        );

    background-size: 10px 10px;

}


/* =========================================================
   TEXTO
========================================================= */

.texto {

    position: relative;

    z-index: 200;

    width: 500px;

    padding: 35px;

    background: rgba(255,255,255,.96);

    color: #171717;

    border-radius: 8px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.10);

    opacity: 0;

    transform: translateX(50px);

    transition:
        opacity 1.5s ease 1.3s,
        transform 1.5s ease 1.3s;

}


/*
   TEXTO APARECE COMPLETO.
   NO HAY MÁQUINA DE ESCRIBIR.
*/

#final.activa .texto {

    opacity: 1;

    transform: translateX(0);

}


/* =========================================================
   TÍTULO
========================================================= */

.texto h1 {

    color: #B87500;

    font-size: 31px;

    line-height: 1.3;

    margin-bottom: 30px;

    font-weight: bold;

}


/* =========================================================
   PÁRRAFOS
========================================================= */

.texto p {

    color: #171717;

    font-size: 21px;

    line-height: 1.65;

    margin-bottom: 20px;

}


/* =========================================================
   GIRASOLES QUE CAEN
========================================================= */

.falling {

    position: fixed;

    top: -100px;

    width: 70px;
    height: 70px;

    z-index: 80;

    pointer-events: none;

    animation:
        caer linear forwards;

}


/* pétalos */

.falling .petal {

    position: absolute;

    width: 18px;
    height: 38px;

    left: 26px;
    top: 1px;

    background: #F5A900;

    border-radius: 50%;

    transform-origin: 9px 38px;

}


.falling .p1 { transform: rotate(0deg); }
.falling .p2 { transform: rotate(45deg); }
.falling .p3 { transform: rotate(90deg); }
.falling .p4 { transform: rotate(135deg); }
.falling .p5 { transform: rotate(180deg); }
.falling .p6 { transform: rotate(225deg); }
.falling .p7 { transform: rotate(270deg); }
.falling .p8 { transform: rotate(315deg); }


/* centro */

.falling .center {

    position: absolute;

    width: 30px;
    height: 30px;

    left: 20px;
    top: 20px;

    background: #542D13;

    border-radius: 50%;

}


/* =========================================================
   ANIMACIÓN DE CAÍDA
========================================================= */

@keyframes caer {

    0% {

        transform:
            translateY(-100px)
            rotate(0deg);

        opacity: 0;

    }


    10% {

        opacity: 1;

    }


    100% {

        transform:
            translateY(115vh)
            translateX(var(--movimiento))
            rotate(720deg);

        opacity: .9;

    }

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 900px) {

    .contenido {

        flex-direction: column;

        gap: 0;

        padding: 10px;

        justify-content: center;

    }


    .planta {

        width: 420px;

        height: 440px;

        transform:
            translateY(150px)
            scale(.52);

        margin-bottom: -130px;

    }


    #final.activa .planta {

        transform:
            translateY(0)
            scale(.60);

    }


    .texto {

        width: 92%;

        max-width: 500px;

        padding: 22px;

        text-align: center;

        transform:
            translateY(30px);

    }


    #final.activa .texto {

        transform:
            translateY(0);

    }


    .texto h1 {

        font-size: 23px;

        margin-bottom: 18px;

    }


    .texto p {

        font-size: 17px;

        line-height: 1.55;

        margin-bottom: 13px;

    }

}


/* =========================================================
   CELULARES PEQUEÑOS
========================================================= */

@media (max-width: 500px) {

    .sunflower {

        transform: scale(.9);

    }


    #apretar {

        font-size: 19px;

    }


    .planta {

        margin-top: -30px;

        margin-bottom: -145px;

    }


    #final.activa .planta {

        transform:
            translateY(0)
            scale(.52);

    }


    .texto {

        width: 94%;

        padding: 18px;

    }


    .texto h1 {

        font-size: 21px;

    }


    .texto p {

        font-size: 16px;

        line-height: 1.45;

    }

}

</style>

</head>


<body>


<!-- =======================================================

<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const boton =
    document.getElementById("apretar");

const inicio =
    document.getElementById("inicio");

const final =
    document.getElementById("final");


/* =========================================================
   AL APRETAR
========================================================= */

boton.addEventListener("click", function() {


    /*
       Primero hacemos aparecer la página blanca.
    */

    final.classList.add("activa");


    /*
       Después hacemos desaparecer
       lentamente la pantalla negra.
    */

    setTimeout(function() {

        inicio.style.opacity = "0";

    }, 100);


    /*
       Quitamos completamente la pantalla
       negra cuando termina la transición.
    */

    setTimeout(function() {

        inicio.style.display = "none";

    }, 2700);


    /*
       Comienza la lluvia de girasoles.
    */

    crearGirasoles();


});



/* =========================================================
   LLUVIA DE GIRASOLES
========================================================= */

function crearGirasoles() {


    for (let i = 0; i < 120; i++) {


        setTimeout(function() {


            const flor =
                document.createElement("div");


            flor.className = "falling";


            /*
               Posición horizontal aleatoria.
            */

            flor.style.left =
                Math.random() * 100 + "vw";


            /*
               Movimiento lateral.
            */

            const movimiento =
                (Math.random() * 300 - 150) + "px";


            flor.style.setProperty(
                "--movimiento",
                movimiento
            );


            /*
               Tamaño aleatorio.
            */

            const escala =
                0.5 + Math.random() * 0.8;


            flor.style.transform =
                "scale(" + escala + ")";


            /*
               Velocidad aleatoria.
            */

            const velocidad =
                4 + Math.random() * 5;


            flor.style.animationDuration =
                velocidad + "s";


            /*
               Dibujamos el girasol.
            */

            flor.innerHTML = `

                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="petal p7"></div>
                <div class="petal p8"></div>

                <div class="center"></div>

            `;


            document.body.appendChild(flor);


            /*
               Limpiar la flor cuando termina.
            */

            setTimeout(function() {

                flor.remove();

            }, (velocidad + 2) * 1000);


        }, i * 80);

    }

}

</script>
